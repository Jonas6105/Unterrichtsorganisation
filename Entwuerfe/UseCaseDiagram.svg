<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <!-- Pfeilspitze für Include-Beziehungen -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
  </defs>

  <!-- Titel -->
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">UML-Use-Case-Diagramm: Antrags- und Genehmigungsprozess</text>

  <!-- Systemgrenze -->
  <rect x="220" y="60" width="620" height="770" rx="10" ry="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="240" y="90" font-size="16" font-weight="bold" fill="#334155">System: Antragsverwaltung Schule</text>

  <!-- ==================== AKTEURE (LINKS) ==================== -->
  <!-- Lehrer -->
  <g id="actor-lehrer" transform="translate(100, 190)">
    <circle cx="0" cy="-20" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="24" stroke="#1e293b" stroke-width="2"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="-18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <text x="0" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Lehrer</text>
    <text x="0" y="88" text-anchor="middle" font-size="11" fill="#64748b">(Antragsteller)</text>
  </g>

  <!-- Abteilungsleiter -->
  <g id="actor-al" transform="translate(100, 470)">
    <circle cx="0" cy="-20" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="24" stroke="#1e293b" stroke-width="2"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="-18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <text x="0" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Abteilungsleiter</text>
    <text x="0" y="88" text-anchor="middle" font-size="11" fill="#64748b">(AL)</text>
  </g>

  <!-- ==================== AKTEURE (RECHTS) ==================== -->
  <!-- Stellv. Schulleiter -->
  <g id="actor-stvsl" transform="translate(960, 420)">
    <circle cx="0" cy="-20" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="24" stroke="#1e293b" stroke-width="2"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="-18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <text x="0" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Stellv. Schulleiter</text>
    <text x="0" y="88" text-anchor="middle" font-size="11" fill="#64748b">(stv. SL)</text>
  </g>

  <!-- Schulleiter -->
  <g id="actor-sl" transform="translate(960, 640)">
    <circle cx="0" cy="-20" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="24" stroke="#1e293b" stroke-width="2"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="-18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="24" x2="18" y2="52" stroke="#1e293b" stroke-width="2"/>
    <text x="0" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Schulleiter</text>
    <text x="0" y="88" text-anchor="middle" font-size="11" fill="#64748b">(SL)</text>
  </g>

  <!-- ==================== USE CASES ==================== -->
  <!-- UC: Am System anmelden -->
  <ellipse cx="530" cy="115" rx="90" ry="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="530" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Am System anmelden</text>

  <!-- UC: Bearbeitungsstand einsehen -->
  <ellipse cx="360" cy="180" rx="100" ry="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="360" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Bearbeitungsstand einsehen</text>

  <!-- UC: Antrag stellen -->
  <ellipse cx="350" cy="270" rx="90" ry="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="350" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Antrag stellen</text>

  <!-- UC: Anlass auswählen -->
  <ellipse cx="660" cy="220" rx="90" ry="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="660" y="225" text-anchor="middle" font-size="12" fill="#334155">Anlass auswählen</text>

  <!-- UC: Formular ausfüllen -->
  <ellipse cx="660" cy="285" rx="90" ry="24" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="660" y="290" text-anchor="middle" font-size="12" fill="#334155">Formular ausfüllen</text>

  <!-- UC: Antrag abzeichnen (AL) -->
  <ellipse cx="370" cy="450" rx="100" ry="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="370" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Antrag abzeichnen (AL)</text>

  <!-- UC: Antrag abzeichnen (stv. SL) -->
  <ellipse cx="710" cy="450" rx="105" ry="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="710" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Antrag abzeichnen (stv. SL)</text>

  <!-- UC: Zweifache Bestätigung (Pop-Up) -->
  <ellipse cx="540" cy="540" rx="105" ry="25" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="544" text-anchor="middle" font-size="11" fill="#78350f">2-fache Abfrage bestätigen</text>

  <!-- UC: Antrag genehmigen (SL) -->
  <ellipse cx="710" cy="650" rx="95" ry="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="710" y="655" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Antrag genehmigen</text>

  <!-- UC: Log-Eintrag erstellen -->
  <ellipse cx="440" cy="740" rx="100" ry="25" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="745" text-anchor="middle" font-size="12" font-style="italic" fill="#1e293b">&lt;&lt;Service&gt;&gt;&#10;Log-Eintrag erstellen</text>

  <!-- ==================== VERBINDUNGEN / ASSOZIATIONEN ==================== -->
  <!-- Lehrer Assoziationen -->
  <line x1="125" y1="180" x2="260" y2="180" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="125" y1="200" x2="265" y2="260" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="125" y1="160" x2="445" y2="125" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- AL Assoziationen -->
  <line x1="130" y1="465" x2="270" y2="455" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="125" y1="440" x2="450" y2="135" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- stv. SL Assoziationen -->
  <line x1="930" y1="435" x2="815" y2="450" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="935" y1="410" x2="610" y2="135" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- SL Assoziationen -->
  <line x1="935" y1="650" x2="805" y2="650" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="935" y1="630" x2="615" y2="135" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- ==================== INCLUDE BEZIEHUNGEN ==================== -->
  <!-- Antrag stellen -> Anlass auswählen -->
  <line x1="430" y1="255" x2="572" y2="230" stroke="#555" stroke-width="1.3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="495" y="235" font-size="10" fill="#555">&lt;&lt;include&gt;&gt;</text>

  <!-- Antrag stellen -> Formular ausfüllen -->
  <line x1="440" y1="275" x2="570" y2="280" stroke="#555" stroke-width="1.3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="495" y="272" font-size="10" fill="#555">&lt;&lt;include&gt;&gt;</text>

  <!-- AL Abzeichnen -> 2-fache Bestätigung -->
  <line x1="430" y1="472" x2="495" y2="517" stroke="#555" stroke-width="1.3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="445" y="510" font-size="10" fill="#555">&lt;&lt;include&gt;&gt;</text>

  <!-- stv. SL Abzeichnen -> 2-fache Bestätigung -->
  <line x1="650" y1="472" x2="585" y2="517" stroke="#555" stroke-width="1.3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="625" y="510" font-size="10" fill="#555">&lt;&lt;include&gt;&gt;</text>

  <!-- Log-Includes -->
  <!-- Von Antrag stellen -->
  <line x1="330" y1="296" x2="410" y2="715" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <!-- Von AL -->
  <line x1="375" y1="476" x2="425" y2="715" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <!-- Von stv. SL -->
  <line x1="680" y1="476" x2="465" y2="718" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <!-- Von SL -->
  <line x1="680" y1="675" x2="505" y2="725" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="455" y="695" font-size="10" fill="#64748b">&lt;&lt;include&gt;&gt;</text>

</svg>
